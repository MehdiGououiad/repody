name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TRIVY_VERSION: "0.72.0"
  SCAN_TAG: security-${{ github.sha }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      # Collect JSON for the merged gate; do not soft-pass the workflow here.
      - name: pnpm audit
        run: |
          mkdir -p dist-security
          pnpm audit --json > dist-security/pnpm-audit.json || echo '{}' > dist-security/pnpm-audit.json

      - name: pip-audit
        run: |
          mkdir -p dist-security
          uvx pip-audit --locked --project backend -f json > dist-security/pip-audit.json || echo '[]' > dist-security/pip-audit.json

      - name: Upload dependency audit artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-deps
          path: dist-security/*.json
          if-no-files-found: warn

  trivy-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      # Collect full JSON for the report; CRITICAL gate runs after merge.
      - name: Trivy filesystem (vuln + license)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          scanners: vuln,license
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy config (Dockerfile, Compose)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: config
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          format: json
          output: trivy-config.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          scanners: secret
          format: json
          output: trivy-secret.json
          exit-code: "0"

      - name: Trivy filesystem SARIF
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Fail on CRITICAL filesystem findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload Trivy repo artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-trivy-repo
          path: |
            trivy-fs.json
            trivy-config.json
            trivy-secret.json
            trivy-fs.sarif

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build scan images
        env:
          REPODY_BACKEND_TAG: ${{ env.SCAN_TAG }}
          REPODY_WEB_TAG: ${{ env.SCAN_TAG }}
          AUTH_SECRET: build-placeholder-secret-32chars-min
          AUTH_KEYCLOAK_CLIENT_SECRET: repody-web-dev-secret
          AUTH_KEYCLOAK_ISSUER: https://auth.example.com/realms/repody
        run: node deploy/scripts/build-images.mjs

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Trivy image backend
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: repody-backend:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          format: json
          output: trivy-image-backend.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy image web
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: repody-web:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          format: json
          output: trivy-image-web.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Fail on CRITICAL image findings (backend)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: repody-backend:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Fail on CRITICAL image findings (web)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: repody-web:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image SARIF (backend)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: repody-backend:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always()
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

      - name: Syft SBOM backend
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.20.1
        with:
          image: repody-backend:${{ env.SCAN_TAG }}
          format: spdx-json
          output-file: syft-backend.spdx.json

      - name: Syft SBOM web
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.20.1
        with:
          image: repody-web:${{ env.SCAN_TAG }}
          format: spdx-json
          output-file: syft-web.spdx.json

      - name: Grype scan backend SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        id: grype-backend
        with:
          sbom: syft-backend.spdx.json
          fail-build: true
          output-format: json
          severity-cutoff: critical

      - name: Grype scan web SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        id: grype-web
        with:
          sbom: syft-web.spdx.json
          fail-build: true
          output-format: json
          severity-cutoff: critical

      - name: Persist Grype JSON
        if: always()
        run: |
          cp "${{ steps.grype-backend.outputs.json }}" grype-backend.json || echo '[]' > grype-backend.json
          cp "${{ steps.grype-web.outputs.json }}" grype-web.json || echo '[]' > grype-web.json

      - name: Upload container scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-containers
          path: |
            trivy-image-backend.json
            trivy-image-web.json
            syft-backend.spdx.json
            syft-web.spdx.json
            grype-backend.json
            grype-web.json

  report:
    runs-on: ubuntu-latest
    needs: [dependency-audit, trivy-repo, container-scan]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Download all scan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: security-*
          merge-multiple: true

      - name: Assemble dist/security
        run: |
          mkdir -p dist/security
          shopt -s nullglob
          for f in artifacts/*.json artifacts/**/*.json; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "dist/security/$base"
          done
          ls -la dist/security || true

      - name: Generate merged report and gate CRITICAL/HIGH
        id: report
        run: node deploy/scripts/security-report.mjs

      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: |
            dist/security/report.md
            dist/security/report.json
            dist/security/*.json
