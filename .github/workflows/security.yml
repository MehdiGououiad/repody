name: Security

# Trivy only: the repository scan covers both lockfiles (pnpm-lock.yaml, backend/uv.lock),
# secrets, and IaC (Dockerfiles, Compose, Helm); the image scan covers OS packages.
# CRITICAL/HIGH fixable findings fail the job. The SARIF results are uploaded to GitHub code
# scanning when the repository has it (public repositories, or GitHub Code Security on private
# ones): set the repository variable CODE_SCANNING=true to turn the upload on.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCAN_TAG: security-${{ github.sha }}

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # SARIF upload
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Trivy repository scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          # License findings are reported for review; only vuln/secret/misconfig gate below.
          scanners: vuln,secret,misconfig,license
          format: sarif
          output: trivy-repository.sarif
          exit-code: "0"

      - name: Fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: deploy/security/trivy.yaml
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && vars.CODE_SCANNING == 'true'
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write  # SARIF upload
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (docker-bake.hcl)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REPODY_IMAGE_TAG: ${{ env.SCAN_TAG }}
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ matrix.target }}
          load: true
          # Reuse the layers CI's platform job cached (read only: this job builds no new ones).
          set: |
            ${{ matrix.target }}.cache-from=type=gha,scope=${{ matrix.target }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repody-${{ matrix.target }}:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          exit-code: "0"

      - name: Fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repody-${{ matrix.target }}:${{ env.SCAN_TAG }}
          trivy-config: deploy/security/trivy.yaml
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && vars.CODE_SCANNING == 'true'
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-image-${{ matrix.target }}
