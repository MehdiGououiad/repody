# repody.com: check that the site still builds when it (or what it syncs from the product:
# theme engine, field types, their names) changes. Cloudflare Workers Builds deploys it from
# master (Worker repody-site > Settings > Builds); this workflow never deploys.
name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "lib/theme/generate.ts"
      - "messages/*.json"
      - "lib/api/catalog.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "lib/theme/generate.ts"
      - "messages/*.json"
      - "lib/api/catalog.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun: the version site/package.json pins (packageManager). Node 26 runs Next.js.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun check
      - name: Dead code (knip)
        run: bun run deadcode
      - run: bun run build
