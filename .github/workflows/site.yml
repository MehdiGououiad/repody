# repody.com: check that the site still builds when it (or what it syncs from the product:
# theme engine, field types, their names) changes. Cloudflare Workers Builds deploys it from
# master (Worker repody-site > Settings > Builds); this workflow never deploys.
name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "lib/theme/generate.ts"
      - "messages/*.json"
      - "lib/api/catalog.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "lib/theme/generate.ts"
      - "messages/*.json"
      - "lib/api/catalog.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Dead code (knip)
        run: pnpm deadcode
      - run: pnpm build
