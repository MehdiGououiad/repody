name: Release promotion

# Verify a published tag before client handoff: both images must carry a cosign signature
# made by the images-ghcr workflow of this repository.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published image tag (e.g. v1.2.3)
        required: true
        type: string
      registry:
        description: Image registry (default ghcr.io/<owner>)
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify signatures
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          TAG: ${{ inputs.tag }}
        run: |
          registry="${REGISTRY:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}}"
          for target in backend web; do
            cosign verify "${registry}/repody-${target}:${TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images-ghcr.yml@"
          done
