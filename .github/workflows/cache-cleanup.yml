name: Cache cleanup

# A closed pull request's caches can never be restored again (a pull request's caches are only
# readable from that pull request), yet GitHub keeps them up to 7 days and they count against the
# repository's 10 GB. Deleting them on close keeps the space for master's caches, which every
# branch reads. GitHub's recipe: https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manage-caches#force-deleting-cache-entries
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # delete caches
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - name: Delete the pull request's caches
        run: |
          ids="$(gh cache list --ref "${REF}" --limit 1000 --json id --jq '.[].id')"
          for id in ${ids}; do
            gh cache delete "${id}"
          done
          echo "deleted $(wc -w <<<"${ids}") caches of ${REF}"
