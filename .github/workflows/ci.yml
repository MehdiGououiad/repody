name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'lib/api/openapi.json'
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'i18n/**'
              - 'proxy.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
              - 'biome.json'
              - 'knip.json'
              - 'e2e/**'
              - 'scripts/**'
            deploy:
              - 'deploy/**'
              - 'compose.yaml'
              - 'Dockerfile*'
              - 'e2e/**'

  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: repody_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d repody_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install backend
        run: uv sync --extra dev
      - name: Lint and format check (ruff)
        run: uv run ruff format --check src tests scripts && uv run ruff check src tests scripts
      - name: Typecheck (pyright)
        run: uv run pyright
      - name: Pytest (unit + integration, Postgres + Alembic)
        run: uv run pytest tests/ -q -m "not live" --tb=short
        env:
          AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit@localhost:5432/repody_test
          AUDIT_SEED_ON_STARTUP: "false"
      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py
      - name: OpenAPI drift check
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code lib/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI types
        run: pnpm codegen:api:types
      - name: Lint and format check (Biome + ESLint)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dead code check
        run: pnpm deadcode
      - name: OpenAPI type drift check
        run: git diff --exit-code lib/api/generated/schema.d.ts
      - name: Deploy checks
        run: pnpm deploy:check
      - name: Build
        run: pnpm build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  k8s-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Hosts entries for Gateway
        run: |
          echo "127.0.0.1 app.repody.local api.repody.local auth.repody.local files.repody.local grafana.repody.local bugsink.repody.local" | sudo tee -a /etc/hosts
      - name: Start local Kubernetes stack
        env:
          DOCKER_BUILDKIT: "1"
        run: pnpm platform
      - name: Playwright smoke
        run: pnpm test:e2e:smoke
        env:
          E2E_API_URL: http://api.repody.local
          E2E_WEB_URL: http://app.repody.local
          E2E_AUTH_URL: http://auth.repody.local
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Live API pytest (Taskiq + workers)
        working-directory: backend
        run: uv sync --extra dev && uv run pytest tests/live -v -m live --tb=short
        env:
          E2E_STACK: "1"
          E2E_API_URL: http://api.repody.local
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 7
      - name: Tear down stack
        if: always()
        run: pnpm platform stop
