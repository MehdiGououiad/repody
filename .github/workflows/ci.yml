name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The filter compares a push with the previous head: full history keeps that commit
          # local, so it needs no credentials to fetch it.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # A change to this workflow runs the jobs it changes.
            backend:
              - 'backend/**'
              - 'lib/api/openapi.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'i18n/**'
              - 'proxy.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
              - 'biome.json'
              - 'knip.json'
              - 'e2e/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'compose*.yaml'
              - 'docker-bake.hcl'
              - 'Dockerfile*'
              - 'backend/Dockerfile'
              - 'e2e/**'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.backend == 'true'
    services:
      # The same images as compose.yaml.
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: repody_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d repody_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Rate limits, the extraction cache and the health check use Redis.
      redis:
        image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install backend
        run: uv sync --locked
      - name: Lint and format check (ruff)
        run: uv run ruff format --check src tests scripts alembic && uv run ruff check src tests scripts alembic
      - name: Typecheck (pyright)
        run: uv run pyright
      - name: Layer contracts (import-linter)
        run: uv run lint-imports
      - name: Pytest (unit + integration, Postgres + Alembic)
        run: uv run pytest -q --tb=short
        env:
          AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit@localhost:5432/repody_test
          AUDIT_SEED_ON_STARTUP: "false"
      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py
      - name: OpenAPI drift check
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code lib/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI types
        run: pnpm codegen:api:types
      - name: Lint and format check (Biome + ESLint)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm test:web
      - name: Dead code check
        run: pnpm deadcode
      - name: OpenAPI type drift check
        run: git diff --exit-code lib/api/generated/schema.d.ts
      - name: Deploy checks
        run: pnpm deploy:check
      - name: Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "*.md" "docs/**/*.md" "deploy/**/*.md" "e2e/**/*.md"
          fail: true
      - name: Build
        run: pnpm build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  # The images built from this commit (docker-bake.hcl) start as a Compose platform and every
  # container turns healthy (host models off). Browser tests run locally (pnpm test:e2e).
  platform:
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success' || needs.changes.outputs.deploy == 'true')
    timeout-minutes: 60
    env:
      REPODY_IMAGE_TAG: ci-${{ github.sha }}
      REPODY_BACKEND_IMAGE: repody-backend:ci-${{ github.sha }}
      REPODY_WEB_IMAGE: repody-web:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images (docker-bake.hcl)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: ./docker-bake.hcl
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      # Waits for every container's healthcheck (compose up --wait); fails on an unhealthy one.
      - name: Start platform (containers only)
        run: pnpm platform -- --platform-only --no-obs --no-pull
      - name: Container logs
        if: failure()
        run: docker compose -p repody logs --no-color --tail 200
      - name: Tear down stack
        if: always()
        run: pnpm platform stop
