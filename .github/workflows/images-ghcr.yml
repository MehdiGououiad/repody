name: Publish images to GHCR

# Builds the images with docker-bake.hcl, attaches BuildKit SBOM and provenance attestations,
# signs the digests with cosign (keyless, GitHub OIDC) and publishes Helm image values. Called by
# CI (ci.yml) once its tests pass on a master commit or a pre-release tag: the images are tagged
# with the commit (12 characters), and CI then deploys them to staging. A release tag never
# builds: release.yml promotes these same signed images, by digest, to production.
#
# The signature names this workflow and the ref it built from
# (images-ghcr.yml@refs/heads/master): deploy.yml accepts only master's for production.
on:
  workflow_call:
    outputs:
      tag:
        description: The images' tag (the commit's first 12 characters)
        value: ${{ jobs.publish.outputs.tag }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the images and their build cache
      id-token: write # keyless cosign signatures
    outputs:
      tag: ${{ steps.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image coordinates
        id: images
        shell: bash
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "tag=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      # docker-bake.hcl rejects an empty or `latest` tag (variable validation).
      - name: Build and push images (docker-bake.hcl)
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REPODY_IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          REPODY_IMAGE_TAG: ${{ steps.images.outputs.tag }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: true
          provenance: mode=max
          sbom: true
          # The layers CI built for this code (its GitHub Actions cache, per image), then the
          # registry cache of the last release.
          set: |
            backend.cache-from=type=gha,scope=backend
            web.cache-from=type=gha,scope=web
            keycloak.cache-from=type=gha,scope=keycloak
            backend.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache
            backend.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache,mode=max
            web.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache
            web.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache,mode=max
            keycloak.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-keycloak:buildcache
            keycloak.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-keycloak:buildcache,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign digests and write Helm image values
        shell: bash
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          REGISTRY: ${{ steps.images.outputs.registry }}
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          mkdir -p dist
          {
            echo "images:"
            for target in backend web keycloak; do
              digest=$(jq -r --arg t "$target" '.[$t]["containerimage.digest"]' <<<"$METADATA")
              cosign sign --yes "${REGISTRY}/repody-${target}@${digest}"
              printf '  %s:\n    repository: %s/repody-%s\n    tag: "%s"\n    digest: %s\n' \
                "$target" "$REGISTRY" "$target" "$TAG" "$digest"
            done
          } > dist/helm-images.yaml
          cat dist/helm-images.yaml

      - name: Upload Helm image values
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repody-images-${{ steps.images.outputs.tag }}
          path: dist/helm-images.yaml
          retention-days: 90
