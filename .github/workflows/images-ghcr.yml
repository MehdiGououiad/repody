name: Publish images to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish. Defaults to the short git SHA.
        required: false
        type: string
      promote:
        description: Run promotion gate (verify + manifest) after publish.
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image coordinates
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_SHA::12}"
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "latest" ]; then
            echo "Refusing mutable/empty image tag: '${tag}'" >&2
            exit 1
          fi
          echo "registry=ghcr.io/${owner}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      - name: Build and push images (docker-bake.hcl)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REPODY_IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          REPODY_IMAGE_TAG: ${{ steps.images.outputs.tag }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: true
          set: |
            backend.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache
            backend.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache,mode=max
            web.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache
            web.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
      - name: SBOM, sign, and attest (cosign keyless)
        env:
          REPODY_IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          REPODY_IMAGE_TAG: ${{ steps.images.outputs.tag }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images-ghcr.yml@.*
        run: node deploy/scripts/release-supply-chain.mjs attest

      - name: Verify signatures (promotion gate)
        if: github.event_name != 'workflow_dispatch' || inputs.promote != false
        env:
          REPODY_IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          REPODY_IMAGE_TAG: ${{ steps.images.outputs.tag }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images-ghcr.yml@.*
        run: node deploy/scripts/release-supply-chain.mjs promote --channel=staging

      - name: Write Helm image values
        shell: bash
        run: |
          mkdir -p dist
          tag="${{ steps.images.outputs.tag }}"
          tag_safe="${tag//\//_}"
          if [ -f "dist/release/${tag_safe}/helm-images.yaml" ]; then
            cp "dist/release/${tag_safe}/helm-images.yaml" dist/repody-ghcr-images.yaml
          else
            cat > dist/repody-ghcr-images.yaml <<EOF
          images:
            backend:
              repository: ${{ steps.images.outputs.registry }}/repody-backend
              tag: "${tag}"
            api:
              repository: ${{ steps.images.outputs.registry }}/repody-backend
              tag: "${tag}"
            worker:
              repository: ${{ steps.images.outputs.registry }}/repody-backend
              tag: "${tag}"
            web:
              repository: ${{ steps.images.outputs.registry }}/repody-web
              tag: "${tag}"
          EOF
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repody-release-${{ steps.images.outputs.tag }}
          path: |
            dist/repody-ghcr-images.yaml
            dist/release/**/*
          retention-days: 90
