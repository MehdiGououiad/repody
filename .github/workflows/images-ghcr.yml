name: Publish images to GHCR

# Build both images with docker-bake.hcl, attach BuildKit SBOM + provenance attestations,
# sign the digests with cosign (keyless, GitHub OIDC), and publish Helm image values.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish. Defaults to the short git SHA.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image coordinates
        id: images
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_SHA::12}"
          fi
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      # docker-bake.hcl rejects an empty or `latest` tag (variable validation).
      - name: Build and push images (docker-bake.hcl)
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REPODY_IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          REPODY_IMAGE_TAG: ${{ steps.images.outputs.tag }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: true
          provenance: mode=max
          sbom: true
          set: |
            backend.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache
            backend.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-backend:buildcache,mode=max
            web.cache-from=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache
            web.cache-to=type=registry,ref=${{ steps.images.outputs.registry }}/repody-web:buildcache,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign digests and write Helm image values
        shell: bash
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          REGISTRY: ${{ steps.images.outputs.registry }}
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          mkdir -p dist
          {
            echo "images:"
            for target in backend web; do
              digest=$(jq -r --arg t "$target" '.[$t]["containerimage.digest"]' <<<"$METADATA")
              cosign sign --yes "${REGISTRY}/repody-${target}@${digest}"
              printf '  %s:\n    repository: %s/repody-%s\n    tag: "%s"\n    digest: %s\n' \
                "$target" "$REGISTRY" "$target" "$TAG" "$digest"
            done
          } > dist/helm-images.yaml
          cat dist/helm-images.yaml

      - name: Upload Helm image values
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repody-images-${{ steps.images.outputs.tag }}
          path: dist/helm-images.yaml
          retention-days: 90
