name: E2E live stack

# Optional live-stack pytest against a running dev deployment.
# Requires E2E_API_URL (and workers) - use workflow_dispatch until a stack is deployed.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Base API URL
        required: false
        default: http://localhost:8000

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install backend
        run: uv sync
      - name: Live API pytest
        run: uv run pytest tests/live -v -m live --tb=short
        env:
          E2E_API_URL: ${{ github.event.inputs.api_url || 'http://localhost:8000' }}
