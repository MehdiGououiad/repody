name: E2E live stack

# Optional live-stack pytest against a running dev deployment.
# Requires E2E_API_URL (and workers) - use workflow_dispatch until a stack is deployed.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Base API URL
        required: false
        default: http://localhost:8000

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install backend
        run: uv sync --extra dev
      - name: Live API pytest
        run: uv run pytest tests/live -v -m live --tb=short
        env:
          E2E_API_URL: ${{ github.event.inputs.api_url || 'http://localhost:8000' }}

  platform-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install backend
        run: uv sync --extra dev
      - name: Platform integration suite
        run: uv run python scripts/platform_integration_suite.py --skip-extraction
        env:
          E2E_API_URL: ${{ github.event.inputs.api_url || 'http://localhost:8000' }}
