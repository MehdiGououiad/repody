[project]
name = "repody"
version = "0.1.0"
description = "Repody — document audit platform backend"
requires-python = ">=3.12"
dependencies = [
  # HTTP API
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.20",
  "sse-starlette>=3.4.11",
  # Database
  "sqlalchemy[asyncio]>=2.0.52",
  "asyncpg>=0.30.0",
  "alembic>=1.15.0",
  # Queue, cache, rate limits
  "taskiq[opentelemetry]>=0.12.6",
  "taskiq-redis>=1.2.0",
  "redis>=8.1.0",
  "limits[async-redis]>=4.4.1",
  # Extraction: llama-server (OpenAI-compatible), PDF rendering, file types
  "openai>=2.54.0",
  "pymupdf>=1.28.2",
  "filetype>=1.2.0",
  # Storage, auth, logs and errors
  "boto3>=1.43.30",
  "pyjwt[crypto]>=2.10.0",
  "structlog>=25.1.0",
  "sentry-sdk[fastapi]>=2.69.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16.6",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=0.25.0",
  "pytest-html>=4.1.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "httpx>=0.28.0",
  "import-linter>=2.15",
]
# OpenTelemetry agent (`opentelemetry-instrument`, see scripts/docker-entrypoint.sh): the distro
# configures the SDK from OTEL_* env and loads every installed instrumentation.
otel = [
  "opentelemetry-distro>=0.65b0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
  "opentelemetry-instrumentation-logging>=0.65b0",
]
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repody"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "N",     # pep8-naming
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "SIM",   # simplify
  "RET",   # early returns
  "PIE",   # misc lints
  "ARG",   # unused arguments
  "DTZ",   # timezone-aware datetimes
  "LOG",   # logging correctness
  "G",     # logging format
  "T20",   # no stray print()
  "TID",   # tidy imports
  "RUF",   # ruff-specific
]
ignore = [
  "E501",  # the formatter wraps code; long strings and URLs stay readable
  "B008",  # FastAPI declares dependencies and form fields in argument defaults
]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: a reader should know where a symbol lives without
# resolving the current module's position in the tree.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
# CLI entry points report progress on stdout by design.
"scripts/**" = ["T20"]
# Tests assert on fixture arguments that linters read as unused, and live
# journey tests print extraction output for the operator running them.
"tests/**" = ["ARG001", "ARG002", "ARG005"]
"tests/live/**" = ["ARG001", "ARG002", "ARG005", "T20"]
# Pydantic deep-copies field defaults per instance, so a list/dict default is
# safe here. Annotating these as ClassVar would drop them from the model.
"src/repody/schemas/*.py" = ["RUF012"]

# Layer contracts: `uv run lint-imports`.
[tool.importlinter]
root_package = "repody"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> HTTP routes -> use cases -> domain -> infrastructure"
type = "layers"
layers = [
  "repody.main | repody.worker",
  "repody.api",
  "repody.app",
  "repody.extraction | repody.rules",
  "repody.infra",
]

[[tool.importlinter.contracts]]
name = "Use cases and domain are framework-free"
type = "forbidden"
source_modules = ["repody.app", "repody.extraction", "repody.rules", "repody.schemas", "repody.infra"]
forbidden_modules = ["fastapi", "starlette", "sse_starlette"]

[[tool.importlinter.contracts]]
name = "Rules are pure"
type = "forbidden"
source_modules = ["repody.rules"]
forbidden_modules = ["sqlalchemy", "redis", "repody.infra", "repody.settings"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "alembic/versions"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]  # tests import shared helpers as `tests.*` (pytest pythonpath)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-m", "not live"]
markers = [
  "unit: pure tests, no services",
  "integration: the app on Postgres and Redis, runs processed inline",
  "live: a running stack with the llama-server (E2E_API_URL)",
]
