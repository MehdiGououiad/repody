[project]
name = "repody"
version = "1.0.0"
description = "Repody — document audit platform backend"
requires-python = ">=3.14"
dependencies = [
  # HTTP API
  "fastapi>=0.162.3",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "python-multipart>=0.0.33",
  # Database
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  # Runs: Hatchet (queue, workers, cron, timeouts, retries, cancellation, rate limits).
  # The 1.x line, written against what V2 keeps (docs.hatchet.run/v1/migration-guide-python-v2).
  "hatchet-sdk>=1.46.0,<2",
  # Extraction: llama-server (OpenAI-compatible); PDFium and Pillow render pages and also check
  # that an upload is the PDF or image it claims to be.
  "openai>=3.49.0",
  "pypdfium2>=5.15.2",
  "pillow>=13.0.0",
  # Storage, auth, logs and errors
  "boto3>=1.43.127",
  "pyjwt[crypto]>=2.15.1",
  "structlog>=26.1.0",
  "sentry-sdk[fastapi]>=2.74.0",
  "json-repair>=0.64.9",
]

[project.optional-dependencies]
# OpenTelemetry agent (`opentelemetry-instrument`, see scripts/docker-entrypoint.sh): the distro
# configures the SDK from OTEL_* env and loads every installed instrumentation, Hatchet's own
# included. No SQLAlchemy instrumentation: it does not support SQLAlchemy 2.1 yet. Logs are
# structlog JSON on stdout (collected into Loki), so no logging instrumentation either.
otel = [
  "hatchet-sdk[otel]>=1.46.0,<2",
  "opentelemetry-distro>=0.66b2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
]
[dependency-groups]
# Development tools (PEP 735): `uv sync` and `uv run` install them; images use --no-dev.
dev = [
  "ruff>=0.17.4",
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "httpx>=0.28.1",
  "import-linter>=2.16",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repody"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "N",     # pep8-naming
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "SIM",   # simplify
  "RET",   # early returns
  "PIE",   # misc lints
  "ARG",   # unused arguments
  "DTZ",   # timezone-aware datetimes
  "LOG",   # logging correctness
  "G",     # logging format
  "T20",   # no stray print()
  "TID",   # tidy imports
  "FAST",  # FastAPI idioms
  "PT",    # pytest style
  "S",     # security (bandit)
  "RUF",   # ruff-specific
]
ignore = [
  "E501",  # the formatter wraps code; long strings and URLs stay readable
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"scripts/**" = ["T20"]
# Tests assert, use fixed demo credentials and unused fixture arguments by design.
"tests/**" = ["ARG001", "ARG002", "ARG005", "S101", "S105", "S106"]
"tests/live/**" = ["T20"]

[tool.importlinter]
root_package = "repody"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> HTTP routes -> use cases -> domain -> infrastructure"
type = "layers"
layers = [
  "repody.main | repody.worker",
  "repody.api",
  "repody.app",
  "repody.extraction | repody.rules",
  "repody.infra",
]

[[tool.importlinter.contracts]]
name = "Use cases and domain are framework-free"
type = "forbidden"
source_modules = ["repody.app", "repody.extraction", "repody.rules", "repody.schemas", "repody.infra"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Rules are pure"
type = "forbidden"
source_modules = ["repody.rules"]
forbidden_modules = ["sqlalchemy", "hatchet_sdk", "repody.infra", "repody.settings"]

[tool.pyright]
include = ["src", "tests", "scripts", "alembic/env.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]  # tests import shared helpers as `tests.*` (pytest pythonpath)

[tool.pytest]
# strict: unknown config keys and markers, and xfail tests that pass, are errors.
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not live"]
markers = [
  "unit: pure tests, no services",
  "integration: the app on Postgres, runs processed inline (no Hatchet)",
  "live: a running stack with the llama-server (E2E_API_URL)",
]
