[project]
name = "repody"
version = "0.1.0"
description = "Repody — document audit platform backend"
requires-python = ">=3.12"
dependencies = [
  # Core API
  "fastapi>=0.137.1",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "python-multipart>=0.0.20",
  "sse-starlette>=2.3.3",
  "asgi-correlation-id>=4.3.4",
  # Database
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.30.0",
  "alembic>=1.15.0",
  # Queue + cache
  "taskiq>=0.12.0",
  "taskiq-redis>=1.2.0",
  "redis>=5.2.0",
  "limits[async-redis]>=4.4.1",
  # Structured LLM
  "instructor>=1.15.3",
  "openai>=1.68.0",
  # HTTP + storage
  "httpx>=0.28.0",
  "boto3>=1.43.30",
  "filetype>=1.2.0",
  # Rules
  "simpleeval>=1.0.3",
  # Auth (Keycloak JWT + Casbin RBAC)
  "pyjwt[crypto]>=2.10.0",
  "cryptography>=44.0.0",
  "casbin>=1.36.0",
  # Observability + reliability
  "structlog>=25.1.0",
  "sentry-sdk[fastapi]>=2.20.0",
  # Document preprocessing
  "pillow>=11.1.0",
  "pymupdf>=1.28.0",
  # Native PDF classify + markdown (Firecrawl); Automode OCR fallback
  "pdf-inspector>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "pyright>=1.1.389",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-html>=4.1.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
]
otel = [
  "opentelemetry-sdk>=1.31.0",
  "opentelemetry-exporter-otlp-proto-http>=1.31.0",
  "opentelemetry-instrumentation-fastapi>=0.52b0",
  "opentelemetry-instrumentation-httpx>=0.52b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.52b0",
  "opentelemetry-instrumentation-logging>=0.52b0",
]
# Official zai-org GLM-OCR document-parsing SDK (PP-DocLayoutV3 + region OCR).
# https://huggingface.co/zai-org/GLM-OCR
# Layout defaults to CPU (AUDIT_GLM_OCR_LAYOUT_DEVICE=cpu). Declare torch/
# torchvision so tool.uv.sources can pin the PyTorch CPU index (avoids CUDA
# nvidia/triton wheels on Linux Docker images).
glmocr = [
  "glmocr[selfhosted]>=0.1.5",
  "torch",
  "torchvision",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repody"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "N",     # pep8-naming
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "SIM",   # simplify
  "RET",   # early returns
  "PIE",   # misc lints
  "ARG",   # unused arguments
  "DTZ",   # timezone-aware datetimes
  "LOG",   # logging correctness
  "G",     # logging format
  "T20",   # no stray print()
  "TID",   # tidy imports
  "RUF",   # ruff-specific
]
ignore = [
  # Handled by formatting/readability review; long SQL/HTML/messages are common here.
  "E501",
  # FastAPI intentionally uses Depends/File/Form/Header calls in endpoint defaults.
  "B008",
  # Public exception names are part of the current service interface.
  "N818",
  # Passing timeout through to HTTP clients is intentional in async adapter functions.
  "ASYNC109",
  # PEP 695 generics are not required for this codebase style yet.
  "UP047",
  # Python 3.11-compatible enum spelling is kept for readability and migrations.
  "UP042",
  # Async tests may use pathlib for fixture paths.
  "ASYNC240",
]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: a reader should know where a symbol lives without
# resolving the current module's position in the tree.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/integration/api/test_routes.py" = ["E402"]
# CLI entry points report progress on stdout by design.
"scripts/**" = ["T20"]
# Tests assert on fixture arguments that linters read as unused, and live
# journey tests print extraction output for the operator running them.
"tests/**" = ["ARG001", "ARG002", "ARG005"]
"tests/live/**" = ["ARG001", "ARG002", "ARG005", "T20"]
# Pydantic deep-copies field defaults per instance, so a list/dict default is
# safe here. Annotating these as ClassVar would drop them from the model.
"src/repody/schemas/*.py" = ["RUF012"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "alembic/versions"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# Tests and one-off scripts lean on MagicMock, SimpleNamespace and partially
# built fixtures. Those patterns are deliberately untyped, so the shape-related
# rules are relaxed there; everything that catches real defects (unbound names,
# bad returns, unreachable code) still applies.
[[tool.pyright.executionEnvironments]]
root = "tests"
# Tests import sibling helpers as `tests.*`, matching pytest's pythonpath = ["."].
extraPaths = ["."]
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportIndexIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "scripts"
# Bench scripts import each other as `scripts.*` after inserting the repo root.
extraPaths = ["."]
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportIndexIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "-ra",
]
markers = [
  "unit: fast pure tests — no DB, no live stack",
  "integration: ASGI + Postgres (or real storage boundary), no Taskiq workers",
  "live: requires running API/stack (E2E_STACK=1 or E2E_API_URL)",
  "e2e: end-to-end journey (API live and/or Playwright UI)",
  "e2e_facture: Facture.pdf path tests (text / llm / optional vlm)",
  "slow: long-running extraction / pipeline cases",
]

[tool.coverage.run]
source = ["repody"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
