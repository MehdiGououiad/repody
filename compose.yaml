# Local/dev data plane. This file is the source of truth for local image pins.
# MinIO: pgsty community fork - upstream minio/minio no longer publishes images.
# Redis/Postgres: official Docker Library pins.
# Docs: docs/LOCAL.md
#
#   pnpm platform          # Hub images: + compose.portable.yaml (see deploy/scripts/platform-dev.mjs)
#   pnpm platform dev      # source lane: data plane here, API/UI/worker from source

name: repody

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-local-dev
      POSTGRES_DB: repody
    ports:
      - "5432:5432"
    volumes:
      - repody-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d repody"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - repody-minio:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minio-local-dev &&
      mc mb --ignore-existing local/audit-documents
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/realm-repody.json:/opt/keycloak/data/import/realm-repody.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Taskiq worker (same image as the API). Scale with `--scale worker=N`.
  worker:
    profiles: [workers]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
      args:
        BACKEND_EXTRAS: ${REPODY_BACKEND_EXTRAS:-otel}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit-local-dev@postgres:5432/repody
      AUDIT_REDIS_URL: redis://redis:6379/0
      AUDIT_S3_ENDPOINT_URL: http://minio:9000
      AUDIT_S3_ACCESS_KEY: minioadmin
      AUDIT_S3_SECRET_KEY: minio-local-dev
      AUDIT_DEPLOYMENT_ENVIRONMENT: development
      AUDIT_LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
      AUDIT_LLAMACPP_SERVED_MODEL: ${AUDIT_LLAMACPP_SERVED_MODEL:-nuextract3-q4_k_m}
      AUDIT_INFERENCE_TIMEOUT_SECONDS: ${AUDIT_INFERENCE_TIMEOUT_SECONDS:-600}
      AUDIT_RUN_TIMEOUT_MINUTES: ${AUDIT_RUN_TIMEOUT_MINUTES:-10}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SENTRY_DSN: ${BUGSINK_DSN:-}
      OTEL_SERVICE_NAME: repody-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Observability (optional: docker compose --profile observability up -d)
  # Grafana :3030 · Loki :3100 · Bugsink :8090 · OTLP :4318 · pnpm dev:src:observability
  bugsink-db:
    profiles: [observability]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink-local-dev
      POSTGRES_DB: bugsink
    volumes:
      - repody-bugsink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10

  bugsink:
    profiles: [observability]
    image: bugsink/bugsink:2
    depends_on:
      bugsink-db:
        condition: service_healthy
    ports:
      - "8090:8000"
    environment:
      SECRET_KEY: local-dev-bugsink-secret-key-at-least-fifty-characters-long
      CREATE_SUPERUSER: admin@repody.local:repody-dev
      PORT: 8000
      DATABASE_URL: postgresql://bugsink:bugsink-local-dev@bugsink-db:5432/bugsink
      BEHIND_HTTPS_PROXY: "false"
      BASE_URL: http://localhost:8090

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - repody-loki:/loki

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - repody-prometheus:/prometheus

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - repody-tempo:/var/tempo
    depends_on:
      prometheus:
        condition: service_started

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  # Log collector (Grafana Alloy - successor to the EOL Promtail).
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.logs:/var/log/repody:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.9
    ports:
      - "3030:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - repody-grafana:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  repody-postgres:
  repody-minio:
  repody-bugsink-db:
  repody-loki:
  repody-tempo:
  repody-prometheus:
  repody-grafana:
