# Local/dev data plane. This file is the source of truth for local image pins.
# Postgres: the official Docker Library pin. Hatchet Lite: the engine's release image.
# Docs: docs/LOCAL.md
#
#   pnpm platform          # images built from this checkout + compose.portable.yaml (deploy/scripts/platform-dev.mjs)
#   pnpm platform dev      # source lane: data plane here, API/UI/worker from source

name: repody

services:
  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    # Hatchet's queue runs on Postgres too: more connections, and more shared memory than the
    # image's 64 MB (https://docs.hatchet.run/self-hosting/docker-compose, "shared memory").
    command: ["postgres", "-c", "max_connections=200"]
    shm_size: 256mb
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-local-dev
      POSTGRES_DB: repody
      # Hatchet's role, as on the VPS; the value is in backend/.env (`pnpm platform` writes it).
      HATCHET_DB_PASSWORD: ${HATCHET_DB_PASSWORD:?set it in backend/.env (pnpm platform setup)}
    ports:
      - "5432:5432"
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-hatchet.sh
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18 (official image layout). New volume:
      # the Postgres 17 one (repody-postgres) stays for a dump (docs/MIGRATING-1.0.md).
      - repody-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d repody"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The run queue and its cron: Hatchet Lite (engine, API and dashboard in one container) on its
  # own database in the Postgres above. Dashboard http://localhost:8888, admin@example.com /
  # Admin123!! (local only). `pnpm platform` creates the API token the API and workers use.
  # https://docs.hatchet.run/self-hosting/hatchet-lite
  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.114.2@sha256:a205018e4ec2c35af4df9c86cf1e36d4b74b36ebbc849c3b33ca18815cf22d6b
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hatchet:${HATCHET_DB_PASSWORD:?set it in backend/.env (pnpm platform setup)}@postgres:5432/hatchet?sslmode=disable
      # Postgres is the queue too (no RabbitMQ). Lite's generated config says rabbitmq, so it is
      # set here rather than left to the image's default.
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_PORT: "7077"
      # Written into each token: what a client on the host uses (containers override both).
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_URL: http://localhost:8888
    ports:
      - "8888:8888"
      - "7077:7077"
    volumes:
      # Its generated config, encryption keys included: tokens stay valid across recreations.
      - repody-hatchet-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8733/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # S3-compatible object storage for uploads (SeaweedFS: master, volume, filer and S3 gateway in
  # one process). The API creates its bucket on startup. https://github.com/seaweedfs/seaweedfs/wiki/Amazon-S3-API
  seaweedfs:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - repody-seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # Hostname v2: tokens are issued for the browser URL; server-to-server endpoints (token,
      # user info, keys) follow the host the caller used, so containers reach keycloak:8080.
      # https://www.keycloak.org/server/hostname
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/realm-repody.json:/opt/keycloak/data/import/realm-repody.json:ro
    healthcheck:
      # Healthy once the realm is served (the web app fetches its discovery document at start), not
      # when the port opens: the same check as the VPS (deploy/vps/compose.yaml).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/repody/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"authorization_endpoint"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The Hatchet worker: the backend image (built here for `pnpm platform dev`; `pnpm platform`
  # builds or pulls REPODY_BACKEND_IMAGE and runs the API from it too, compose.portable.yaml).
  # One run at a time: the host llama-server answers one request at a time.
  # Scale with `--scale worker=N`.
  worker:
    profiles: [workers]
    image: ${REPODY_BACKEND_IMAGE:-repody-backend:dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend
      args:
        BACKEND_EXTRAS: ${REPODY_BACKEND_EXTRAS:-otel}
    command: ["python", "-m", "repody.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-lite:
        condition: service_healthy
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit-local-dev@postgres:5432/repody
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: hatchet-lite:7077
      HATCHET_CLIENT_SERVER_URL: http://hatchet-lite:8888
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: "true"
      AUDIT_WORKER_CONCURRENCY: "1"
      AUDIT_S3_ENDPOINT_URL: http://seaweedfs:8333
      AUDIT_S3_ACCESS_KEY: repody
      AUDIT_S3_SECRET_KEY: s3-local-dev
      AUDIT_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/repody
      AUDIT_KEYCLOAK_ADMIN_CLIENT_SECRET: repody-admin-dev-secret
      AUDIT_DEPLOYMENT_ENVIRONMENT: development
      AUDIT_INFERENCE_BASE_URL: http://host.docker.internal:8081/v1
      AUDIT_INFERENCE_MODEL: ${AUDIT_INFERENCE_MODEL:-nuextract3-q8_0}
      AUDIT_INFERENCE_TIMEOUT_SECONDS: ${AUDIT_INFERENCE_TIMEOUT_SECONDS:-600}
      AUDIT_RUN_TIMEOUT_MINUTES: ${AUDIT_RUN_TIMEOUT_MINUTES:-10}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SENTRY_DSN: ${BUGSINK_DSN:-}
      OTEL_SERVICE_NAME: repody-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The SDK's /health: 503 once the worker's listener stops answering.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Observability (optional: docker compose --env-file backend/.env --profile observability up -d)
  # Grafana :3030 · Loki :3100 · Bugsink :8090 · OTLP :4318 · pnpm dev:src:observability
  bugsink-db:
    profiles: [observability]
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink-local-dev
      POSTGRES_DB: bugsink
    volumes:
      - repody-bugsink-db-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10

  bugsink:
    profiles: [observability]
    image: bugsink/bugsink:2.6.3@sha256:d19378dc3ad8fac46b2d554019540e84d607c176b3e0774a10c55458f1288fa0
    depends_on:
      bugsink-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      SECRET_KEY: local-dev-bugsink-secret-key-at-least-fifty-characters-long
      CREATE_SUPERUSER: admin@repody.local:repody-dev
      PORT: 8000
      DATABASE_URL: postgresql://bugsink:bugsink-local-dev@bugsink-db:5432/bugsink
      BEHIND_HTTPS_PROXY: "false"
      BASE_URL: http://localhost:8090
      PHONEHOME: "False"

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - repody-loki:/loki

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - repody-prometheus:/prometheus

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./deploy/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - repody-tempo:/var/tempo
    depends_on:
      prometheus:
        condition: service_started

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4317:4317"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  # Log collector (Grafana Alloy - successor to the EOL Promtail).
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: ["run", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.logs:/var/log/repody:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # No usage reports or update checks to grafana.com.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - repody-grafana:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

configs:
  # Hatchet's database and role, created on the first start of an empty Postgres volume.
  postgres-init:
    content: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<SQL
      CREATE ROLE hatchet LOGIN PASSWORD '$$HATCHET_DB_PASSWORD';
      CREATE DATABASE hatchet OWNER hatchet;
      SQL

volumes:
  repody-postgres-18:
  repody-hatchet-config:
  repody-seaweedfs:
  repody-bugsink-db-18:
  repody-loki:
  repody-tempo:
  repody-prometheus:
  repody-grafana:
