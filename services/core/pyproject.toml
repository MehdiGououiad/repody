[project]
name = "repody-core"
version = "0.1.0"
description = "Repody Core Spine — cases, artifacts, durable pipelines, Four-Eyes approvals, and immutable audit trail"
requires-python = ">=3.14"
dependencies = [
  "repody-common",
  "fastapi>=0.162.3",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "hatchet-sdk>=1.46.0,<2",
  "jcs>=0.2.1",
  "structlog>=26.1.0",
  "httpx>=0.28.1",
]

[tool.uv.sources]
repody-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repody_core"]

[tool.importlinter]
root_package = "repody_core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core layers: entry points -> HTTP routes -> use cases -> infra -> schemas, settings"
type = "layers"
layers = [
  "repody_core.main | repody_core.worker",
  "repody_core.api",
  "repody_core.app",
  "repody_core.infra",
  "repody_core.schemas",
  "repody_core.settings",
]

[[tool.importlinter.contracts]]
name = "Core use cases, infra, and schemas stay FastAPI-free"
type = "forbidden"
source_modules = ["repody_core.app", "repody_core.infra", "repody_core.schemas"]
forbidden_modules = ["fastapi", "starlette"]

[tool.pyright]
include = ["src", "tests", "alembic/env.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.pytest]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
