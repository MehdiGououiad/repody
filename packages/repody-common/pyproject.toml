[project]
name = "repody-common"
version = "0.1.0"
description = "Shared contracts, offline licensing, identifiers, and port protocols for Repody services"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14.3", "pyjwt[crypto]>=2.15.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repody_common"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"

[tool.pytest]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
