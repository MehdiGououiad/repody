# Trivy configuration - shared by CI (.github/workflows/security.yml) and local `trivy fs --config deploy/security/trivy.yaml .`
# Docs: https://aquasecurity.github.io/trivy/latest/docs/references/configuration/config-file/

scan:
  skip-dirs:
    - .next
    - node_modules
    - backend/.venv
    - dist
    - e2e/report
    - e2e/test-results
    - "**/.runtime"
    # Local-only material (git-ignored): model weights, private fixtures, worktrees.
    - deploy/llamacpp/models
    - private
    - .claude
  skip-files:
    - "**/*.pdf"

severity:
  - CRITICAL
  - HIGH
  - MEDIUM

vulnerability:
  ignore-unfixed: true

# Accepted findings, each with its reason and expiry date.
ignorefile: deploy/security/trivyignore.yaml

secret:
  config: deploy/security/trivy-secret.yaml

misconfiguration:
  include-non-failures: false

license:
  full: false

db:
  no-progress: true
