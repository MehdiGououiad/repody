# Official PaddleX OCR pipeline config for Repody PP-OCRv6 serving.
# Generated baseline: `paddlex --get_pipeline_config OCR`
# Serving notes:
#   https://www.paddleocr.ai/latest/en/version3.x/inference_deployment/serving/serving.html
#   https://www.paddleocr.ai/latest/en/version3.x/pipeline_usage/OCR.html

pipeline_name: OCR

text_type: general

use_doc_preprocessor: True
use_textline_orientation: True

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    use_doc_orientation_classify: True
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

SubModules:
  TextDetection:
    module_name: text_detection
    model_name: PP-OCRv6_medium_det
    model_dir: null
    limit_side_len: 64
    limit_type: min
    max_side_limit: 4000
    thresh: 0.3
    box_thresh: 0.6
    unclip_ratio: 1.5
  TextLineOrientation:
    module_name: textline_orientation
    model_name: PP-LCNet_x1_0_textline_ori
    model_dir: null
    batch_size: 6
  TextRecognition:
    module_name: text_recognition
    model_name: PP-OCRv6_medium_rec
    model_dir: null
    batch_size: 6
    score_thresh: 0.0

# Basic Serving defaults (official Serving guide).
# Clients may still override `visualize` in POST /ocr.
Serving:
  visualize: False
  extra:
    # Official default caps PDF/TIFF at 10 pages; null removes the limit.
    max_num_input_imgs: null
