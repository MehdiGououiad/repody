# Local dev - single-node Tempo 3 (OTLP in, local blocks). Tempo 3 removed the metrics
# generator's local-blocks processor and its traces_storage (its 3.0 migration guide).
# https://grafana.com/docs/tempo/latest/configuration/
stream_over_http_enabled: true

# No usage reports to Grafana Labs.
usage_report:
  reporting_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Service graphs and span metrics. Tempo remote-writes them to Prometheus.
# https://grafana.com/docs/tempo/latest/metrics-from-traces/service_graphs/enable-service-graphs/
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
