{{- if and (eq (toString (index .Values.config "AUDIT_DEPLOYMENT_ENVIRONMENT")) "production") (ne (toString (index .Values.config "AUDIT_OIDC_ENABLED")) "true") }}
{{- fail "production requires config.AUDIT_OIDC_ENABLED=\"true\"" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repody.fullname" . }}-config
  labels:
    {{- include "repody.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  # The migrations Job owns schema upgrades; pods only run them when the Job is disabled.
  AUDIT_RUN_MIGRATIONS_ON_STARTUP: {{ ternary "false" "true" .Values.migrations.enabled | quote }}
  AUDIT_SEED_ON_STARTUP: "false"
