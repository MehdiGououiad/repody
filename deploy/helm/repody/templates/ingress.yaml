{{- if .Values.ingress.enabled }}
{{- $fullname := include "repody.fullname" . }}
{{- $routes := list (dict "host" .Values.ingress.host "service" (printf "%s-web" $fullname) "port" 3000) }}
{{- with .Values.ingress.apiHost }}
{{- $routes = append $routes (dict "host" . "service" (printf "%s-api" $fullname) "port" 8000) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "repody.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName | quote }}
      hosts:
        {{- range $routes }}
        - {{ .host | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service | quote }}
                port:
                  number: {{ .port }}
    {{- end }}
{{- end }}
