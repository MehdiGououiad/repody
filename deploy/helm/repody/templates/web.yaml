{{- $ctx := dict "root" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" . }}-web
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "repody.podDefaults" $ctx | nindent 6 }}
      containers:
        - name: web
          image: {{ include "repody.image" (dict "image" .Values.images.web "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: INTERNAL_API_URL
              value: http://{{ include "repody.fullname" . }}-api:8000
            - name: AUDIT_OIDC_ENABLED
              value: {{ index .Values.config "AUDIT_OIDC_ENABLED" | toString | quote }}
            - name: AUTH_KEYCLOAK_ID
              value: {{ .Values.web.keycloakClientId | quote }}
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ index .Values.config "AUDIT_OIDC_ISSUER" | quote }}
            {{- with .Values.web.internalIssuer }}
            - name: AUTH_KEYCLOAK_INTERNAL_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.authUrl }}
            - name: BETTER_AUTH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $key := dict "BETTER_AUTH_SECRET" "AUTH_SECRET" "AUTH_KEYCLOAK_SECRET" "AUTH_KEYCLOAK_CLIENT_SECRET" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret }}, key: {{ $key }} }
            {{- end }}
            {{- range list "BUGSINK_DSN" "NEXT_PUBLIC_BUGSINK_DSN" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret }}, key: BUGSINK_DSN, optional: true }
            {{- end }}
            - name: SENTRY_RELEASE
              value: {{ .Values.images.web.tag | default .Chart.AppVersion | quote }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "repody.fullname" . }}-web
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "repody.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
