{{- range $pool, $worker := .Values.workers }}
{{- $component := printf "worker-%s" $pool }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" $ }}-{{ $component }}
  labels:
    {{- include "repody.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not $worker.autoscaling.enabled }}
  replicas: {{ $worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      {{- include "repody.podDefaults" $ctx | nindent 6 }}
      # Taskiq finishes the running task on SIGTERM; give it time before SIGKILL.
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "repody.image" (dict "image" $.Values.images.backend "root" $) | quote }}
          imagePullPolicy: {{ $.Values.images.backend.pullPolicy }}
          command: [python, -m, repody.taskiq.worker]
          securityContext:
            {{- include "repody.containerSecurityContext" $ | nindent 12 }}
          {{- include "repody.backendEnvFrom" $ | nindent 10 }}
          env:
            - name: AUDIT_WORKER_POOL
              value: {{ $pool | quote }}
            - name: AUDIT_WORKER_{{ upper $pool }}_MAX_JOBS
              value: {{ $worker.maxJobs | quote }}
            - name: AUDIT_OTEL_SERVICE_NAME
              value: repody-{{ $component }}
          readinessProbe:
            exec:
              command: [python, -m, repody.taskiq.healthcheck]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
{{- end }}
