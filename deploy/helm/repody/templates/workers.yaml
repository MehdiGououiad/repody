{{- $worker := .Values.worker }}
{{- $ctx := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" . }}-worker
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not $worker.autoscaling.enabled }}
  replicas: {{ $worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "repody.podDefaults" $ctx | nindent 6 }}
      # Time for the runs in progress to finish on SIGTERM before SIGKILL.
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "repody.image" (dict "image" .Values.images.backend "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          # args (not command) so the image entrypoint can start the OTEL agent.
          args: [python, -m, repody.worker]
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          {{- include "repody.backendEnvFrom" . | nindent 10 }}
          env:
            {{- include "repody.backendSecretEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: repody-worker
            - name: AUDIT_WORKER_CONCURRENCY
              value: {{ $worker.concurrency | quote }}
            - name: HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED
              value: "true"
          # The Hatchet SDK's health server: 503 once the worker's listener stops answering.
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
