{{- $worker := .Values.worker }}
{{- $ctx := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" . }}-worker
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not $worker.autoscaling.enabled }}
  replicas: {{ $worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "repody.podDefaults" $ctx | nindent 6 }}
      # Taskiq finishes the running task on SIGTERM; give it time before SIGKILL.
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "repody.image" (dict "image" .Values.images.backend "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          # args (not command) so the image entrypoint can start the OTEL agent.
          args: [taskiq, worker, "repody.worker:broker", --workers, "1", --max-async-tasks, {{ $worker.concurrency | quote }}]
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          {{- include "repody.backendEnvFrom" . | nindent 10 }}
          env:
            {{- include "repody.backendSecretEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: repody-worker
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
# Sends the periodic maintenance task to the workers (Taskiq scheduler). Exactly one replica:
# two would send every scheduled task twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" . }}-scheduler
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" (dict "root" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" (dict "root" . "component" "scheduler") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "repody.podDefaults" (dict "root" . "component" "scheduler") | nindent 6 }}
      containers:
        - name: scheduler
          image: {{ include "repody.image" (dict "image" .Values.images.backend "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          args: [taskiq, scheduler, "repody.worker:scheduler"]
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          {{- include "repody.backendEnvFrom" . | nindent 10 }}
          env:
            {{- include "repody.backendSecretEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: repody-scheduler
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
