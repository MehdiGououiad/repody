{{- $components := dict "api" .Values.api "web" .Values.web }}
{{- range $pool, $worker := .Values.workers }}
{{- $_ := set $components (printf "worker-%s" $pool) $worker }}
{{- end }}
{{- range $component, $spec := $components }}
{{- with $spec.autoscaling }}
{{- if .enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "repody.fullname" $ }}-{{ $component }}
  labels:
    {{- include "repody.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "repody.fullname" $ }}-{{ $component }}
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
  # Scale up fast, scale down slowly.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 10, periodSeconds: 60 }
{{- end }}
{{- end }}
{{- end }}
