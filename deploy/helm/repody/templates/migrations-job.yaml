{{- if .Values.migrations.enabled }}
{{- $ctx := dict "root" . "component" "migrations" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "repody.fullname" . }}-migrations
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: {{ include "repody.image" (dict "image" .Values.images.backend "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [python, /app/scripts/bootstrap_migrations.py]
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          # A pre-install hook runs before the chart's ConfigMap exists: only the Secret is used.
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
