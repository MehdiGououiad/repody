{{- $ctx := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repody.fullname" . }}-api
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "repody.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "repody.selectorLabels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "repody.podDefaults" $ctx | nindent 6 }}
      containers:
        - name: api
          image: {{ include "repody.image" (dict "image" .Values.images.backend "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          args: [uvicorn, repody.main:app, --host, 0.0.0.0, --port, "8000"]
          securityContext:
            {{- include "repody.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports:
            - name: http
              containerPort: 8000
          {{- include "repody.backendEnvFrom" . | nindent 10 }}
          env:
            {{- include "repody.backendSecretEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: repody-api
          readinessProbe:
            httpGet: { path: /v1/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/healthz/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "repody.fullname" . }}-api
  labels:
    {{- include "repody.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "repody.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
