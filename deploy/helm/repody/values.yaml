# Repody app chart: API, web, Hatchet workers, migrations job and Ingress.
# PostgreSQL, Hatchet (its Helm chart, https://docs.hatchet.run/self-hosting/kubernetes-quickstart,
# or Hatchet Cloud), S3-compatible storage, the OIDC provider (Keycloak) and the NuExtract endpoint
# are external services you point the chart at.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  backend:
    repository: repody-backend
    tag: "1.0.0"
    # Prefer a digest in GitOps (sha256:…); when set it wins over the tag.
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: repody-web
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent

# Secret holding the runtime credentials (create it with External Secrets / Vault / SOPS):
#   AUDIT_DATABASE_URL, HATCHET_CLIENT_TOKEN, AUDIT_S3_ACCESS_KEY, AUDIT_S3_SECRET_KEY,
#   AUTH_SECRET, AUTH_KEYCLOAK_CLIENT_SECRET, and optionally AUDIT_INFERENCE_API_KEY, BUGSINK_DSN,
#   KEYCLOAK_ADMIN_CLIENT_SECRET (the admin area's Keycloak account: docs/CLUSTER.md).
existingSecret: repody-runtime-secrets

# Non-secret settings, rendered into the ConfigMap as-is. Every key is documented in
# deploy/ENV.md; anything not set here uses the application default.
config:
  AUDIT_DEPLOYMENT_ENVIRONMENT: production
  AUDIT_OIDC_ENABLED: "true"
  AUDIT_OIDC_ISSUER: https://auth.example.com/realms/repody
  AUDIT_OIDC_AUDIENCE: repody-api
  AUDIT_S3_ENDPOINT_URL: https://s3.example.com
  AUDIT_S3_BUCKET: audit-documents
  AUDIT_INFERENCE_BASE_URL: https://vlm.example.com/v1
  AUDIT_INFERENCE_MODEL: nuextract3-q8_0
  # AUDIT_CORS_ORIGINS: only for browser apps on other origins (the web app is same-origin).
  AUDIT_LOG_JSON: "true"
  # The admin area manages client groups and users in Keycloak as repody-admin; the API reaches
  # the realm here (in-cluster, like web.internalIssuer). Unset: AUDIT_OIDC_ISSUER.
  # AUDIT_KEYCLOAK_INTERNAL_ISSUER: http://keycloak.keycloak.svc:8080/realms/repody
  # Credits (deploy/ENV.md, "Credits"): every run is metered; refuse runs at zero only when a
  # contract sells a page quota. A client's own installation usually leaves them off.
  # AUDIT_CREDITS_ENFORCED: "false"
  # AUDIT_CREDIT_RUN_FEE: "0"
  # AUDIT_MAX_PAGES_PER_RUN: "100"
  # Access requests are Repody's own site's form: leave them off (the route answers 404). On,
  # production needs TURNSTILE_SECRET in the Secret.
  # AUDIT_ACCESS_REQUESTS_ENABLED: "false"
  # Several client companies on one installation: users outside every company see nothing.
  # AUDIT_REQUIRE_CLIENT_GROUP: "false"
  # Keys from the in-cluster Keycloak when the public issuer is not reachable from the pods.
  # AUDIT_OIDC_JWKS_URL: http://keycloak.keycloak.svc:8080/realms/repody/protocol/openid-connect/certs
  # The model server: requests in flight (its parallel slots), and whether the settings page asks
  # it if it is up ("false" for one that scales to zero and would start, and bill, on the question).
  # AUDIT_INFERENCE_CONCURRENCY: "1"
  # AUDIT_INFERENCE_PROBE: "true"
  # Limits: pages per document, runs a minute per client, a whole upload request (keep the web
  # app's 100 MiB proxy limit in mind), and days runs are kept (0: forever).
  # AUDIT_MAX_PAGES_PER_DOCUMENT: "99"
  # AUDIT_RUNS_PER_MINUTE_PER_CLIENT: "10"
  # AUDIT_MAX_REQUEST_BYTES: "104857600"
  # AUDIT_RUN_RETENTION_DAYS: "0"
  # Hatchet's gRPC address and API URL come from the token; set these to reach it in-cluster.
  # HATCHET_CLIENT_HOST_PORT: hatchet-engine.hatchet.svc:7070
  # HATCHET_CLIENT_SERVER_URL: http://hatchet-api.hatchet.svc:8080
  # HATCHET_CLIENT_TLS_STRATEGY: none

migrations:
  # Pre-install/pre-upgrade Job running `alembic upgrade head`.
  enabled: true
  backoffLimit: 3

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }

# Hatchet workers: each runs `concurrency` runs at once (keep 1 per replica when replicas
# share one GPU-backed inference endpoint); they also run the maintenance cron.
worker:
  replicas: 2
  concurrency: 1
  terminationGracePeriodSeconds: 240
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 2Gi }
  autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 75 }
  podDisruptionBudget: { enabled: true, maxUnavailable: 1 }

web:
  replicas: 2
  # Better Auth against Keycloak. The browser uses AUDIT_OIDC_ISSUER; set internalIssuer when
  # pods cannot reach that public URL (e.g. http://keycloak.auth.svc:8080/realms/repody). Keycloak
  # must then run with KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true (https://www.keycloak.org/server/hostname).
  keycloakClientId: repody-web
  internalIssuer: ""
  # Public URL of the web app when it differs from the request host (BETTER_AUTH_URL).
  authUrl: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }

# Spread every component's replicas across nodes.
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  host: app.example.com
  # Optional: expose the API on its own host (integrators call /v1/... directly).
  apiHost: api.example.com
  tls:
    enabled: true
    secretName: repody-tls

networkPolicy:
  # Default-deny for the release; allows DNS, traffic inside the release, ingress to web/api,
  # and egress to the CIDRs below (database, Hatchet, S3, OIDC, inference).
  enabled: false
  # Namespaces running cluster DNS (kube-system on Kubernetes, openshift-dns on OpenShift).
  dnsNamespaces: [kube-system, openshift-dns]
  egressCidrs: []
  egressPorts: [443, 5432, 7070, 8080, 8081, 9000]
