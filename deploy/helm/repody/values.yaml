# Repody app chart: API, web, Taskiq workers, migrations job and Ingress.
# PostgreSQL, Redis, S3/MinIO, the OIDC provider (Keycloak) and the NuExtract endpoint
# are external services you point the chart at.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  backend:
    repository: repody-backend
    tag: "0.1.0"
    # Prefer a digest in GitOps (sha256:…); when set it wins over the tag.
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: repody-web
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent

# Secret holding the runtime credentials (create it with External Secrets / Vault / SOPS):
#   AUDIT_DATABASE_URL, AUDIT_REDIS_URL, AUDIT_MINIO_ACCESS_KEY, AUDIT_MINIO_SECRET_KEY,
#   AUTH_SECRET, AUTH_KEYCLOAK_CLIENT_SECRET, and optionally AUDIT_LLAMACPP_API_KEY, BUGSINK_DSN.
existingSecret: repody-runtime-secrets

# Non-secret settings, rendered into the ConfigMap as-is. Every key is documented in
# deploy/ENV.md; anything not set here uses the application default.
config:
  AUDIT_DEPLOYMENT_ENVIRONMENT: production
  AUDIT_OIDC_ENABLED: "true"
  AUDIT_OIDC_ISSUER: https://auth.example.com/realms/repody
  AUDIT_OIDC_AUDIENCE: repody-api
  AUDIT_MINIO_ENDPOINT: minio.example.com:9000
  AUDIT_MINIO_BUCKET: audit-documents
  # Browser-reachable host for presigned uploads (the files Ingress host or your S3 endpoint).
  AUDIT_MINIO_PUBLIC_ENDPOINT: files.example.com
  AUDIT_LLAMACPP_BASE_URL: https://vlm.example.com/v1
  AUDIT_LLAMACPP_SERVED_MODEL: nuextract3-q4_k_m
  AUDIT_CORS_ORIGINS: '["https://app.example.com"]'
  AUDIT_RATE_LIMIT_FAIL_CLOSED: "true"
  AUDIT_LOG_JSON: "true"

migrations:
  # Pre-install/pre-upgrade Job running `alembic upgrade head`.
  enabled: true
  backoffLimit: 3

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }

# One Deployment per Taskiq pool: `extract` calls the model, `fast` only evaluates rules.
workers:
  extract:
    replicas: 2
    # Keep 1 per replica when replicas share one GPU-backed endpoint.
    maxJobs: 1
    terminationGracePeriodSeconds: 240
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 2Gi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 75 }
    podDisruptionBudget: { enabled: true, maxUnavailable: 1 }
  fast:
    replicas: 2
    maxJobs: 8
    terminationGracePeriodSeconds: 60
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
    podDisruptionBudget: { enabled: true, maxUnavailable: 1 }

web:
  replicas: 2
  # Auth.js against Keycloak. The browser uses AUDIT_OIDC_ISSUER; set internalIssuer when
  # pods cannot reach that public URL (e.g. http://keycloak.auth.svc:8080/realms/repody).
  keycloakClientId: repody-web
  internalIssuer: ""
  # Public URL of the web app when it differs from the request host (Auth.js AUTH_URL).
  authUrl: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }

# Spread every component's replicas across nodes.
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  host: app.example.com
  # Optional: expose the API on its own host (integrators call /v1/... directly).
  apiHost: api.example.com
  # Optional: route a files host to your S3/MinIO Service for browser presigned uploads.
  filesHost: ""
  filesService: { name: "", port: 9000 }
  tls:
    enabled: true
    secretName: repody-tls

networkPolicy:
  # Default-deny for the release; allows DNS, traffic inside the release, ingress to web/api,
  # and egress to the CIDRs below (database, Redis, S3, OIDC, inference).
  enabled: false
  egressCidrs: []
  egressPorts: [443, 5432, 6379, 8080, 8081, 9000]
