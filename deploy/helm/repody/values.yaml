# Enterprise default: Repody owns stateless app workloads only.
# Stateful systems, auth, secrets, observability, and inference are external/platform services.
# Bundled data plane: use deploy/client/values-bundled.example.yaml (OpenShift or generic K8s).

global:
  imagePullSecrets: []
  deploymentEnvironment: production

# Portable hardening (Kubernetes PSA restricted + OpenShift restricted-v2).
# Same securityContext on every cluster: runAsNonRoot, no pinned UID.
# Local / Compose may set restricted: false.
platform:
  compatibility:
    restricted: true

images:
  backend:
    repository: repody-backend
    tag: "0.1.0"
    # Prefer digest in GitOps (image@sha256:…). Empty digest falls back to tag.
    digest: ""
    pullPolicy: IfNotPresent
  api:
    repository: repody-backend
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: repody-backend
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: repody-web
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent

# ── Bundled data plane (local/dev only; disabled for enterprise) ──────────────
postgresql:
  enabled: false
  auth:
    username: audit
    database: repody
    existingSecret: ""
    password: ""
  primary:
    persistence:
      enabled: true
      size: 20Gi

redis:
  enabled: false
  architecture: standalone
  auth:
    # Production forbids enabling this subchart; if enabled outside production, require auth.
    enabled: true

minio:
  enabled: false
  mode: standalone
  image:
    repository: pgsty/minio
    tag: RELEASE.2026-06-18T00-00-00Z
  console:
    enabled: false
  auth:
    rootUser: minioadmin
    rootPassword: ""
  defaultBuckets: audit-documents
  persistence:
    enabled: true
    size: 50Gi

# ── External data plane (disable subcharts above, set URLs) ───────────────────
externalDatabase:
  enabled: true
  url: ""
  host: ""
  port: 5432
  existingSecret: repody-runtime-secrets
  urlKey: AUDIT_DATABASE_URL

externalRedis:
  enabled: true
  url: ""
  existingSecret: repody-runtime-secrets
  urlKey: AUDIT_REDIS_URL

externalObjectStorage:
  enabled: true
  endpoint: ""
  bucket: audit-documents
  accessKey: ""
  secretKey: ""
  existingSecret: repody-runtime-secrets
  accessKeyKey: AUDIT_MINIO_ACCESS_KEY
  secretKeyKey: AUDIT_MINIO_SECRET_KEY
  secure: true
  publicEndpoint: ""

init:
  waitImage: busybox:1.37.0

migrations:
  # Prefer a single pre-install/upgrade Job (Alembic once) over concurrent API startups.
  # Keep enabled=true whenever api.replicas > 1. Setting enabled=false makes every API
  # pod run migrations on startup (AUDIT_RUN_MIGRATIONS_ON_STARTUP=true in ConfigMap).
  enabled: true
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 3

# Skaffold / local hot-reload (uvicorn --reload when files are synced into the pod)
dev:
  apiReload: false

# HPA v2 behavior — requires metrics-server (or OpenShift cluster monitoring).
# Scale up quickly on CPU spikes; scale down slowly to avoid flapping.
# See https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior
hpaBehavior:
  enabled: true
  scaleUp:
    stabilizationWindowSeconds: 60
    selectPolicy: Max
    policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 300
    selectPolicy: Min
    policies:
      - type: Percent
        value: 10
        periodSeconds: 60

# ── Control plane (api) ───────────────────────────────────────────────────────
api:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ── Worker plane (scale here first) ───────────────────────────────────────────
workerExtract:
  replicas: 2
  pool: extract
  maxJobs: 1
  warmupOnStart: false
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  terminationGracePeriodSeconds: 240
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

workerFast:
  replicas: 2
  pool: fast
  maxJobs: 8
  warmupOnStart: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  terminationGracePeriodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ── Edge (web) ────────────────────────────────────────────────────────────────
web:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ── In-cluster Keycloak (staging/local; production usually uses external IdP) ─
keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:26.6.4
  realm: repody
  hostname: auth.example.com
  # Busybox image for web pod init that maps gatewayApi.authHost → in-cluster Keycloak.
  authHostAliasInitImage: ""
  hostnameStrict: false
  hostnameStrictHttps: false
  proxyHeaders: xforwarded
  adminUsername: admin
  adminPassword: ""
  existingSecret: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

ingress:
  enabled: true
  className: ""
  host: app.example.com
  apiHost: api.example.com
  filesHost: files.example.com
  filesServiceName: ""
  filesServicePort: 9000
  annotations: {}
  controllerAnnotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    enabled: true
    secretName: repody-tls

gatewayApi:
  enabled: false
  createGatewayClass: false
  gatewayClassName: envoy-gateway
  gatewayClassControllerName: gateway.envoyproxy.io/gatewayclass-controller
  host: app.example.com
  apiHost: api.example.com
  filesHost: files.example.com
  authHost: auth.example.com
  authExternalName: ""
  authExternalAddress: ""
  authExternalPort: 8080
  # In-cluster Keycloak or external IdP Service (may be in another namespace).
  authServiceName: ""
  authServiceNamespace: ""
  authServicePort: 8080
  filesServiceName: ""
  filesServiceNamespace: ""
  filesServicePort: 9000
  authHostAliasInitImage: ""
  # Dev-only: root init rewrites /etc/hosts for authHost (breaks restricted profile). Use
  # authHostAliasIp or an external IdP URL in production instead.
  authHostAliasInitEnabled: false
  # Optional EnvoyProxy (gateway.envoyproxy.io) for custom Gateway service shape.
  envoyProxyName: ""
  kindNodePort: 0
  # Optional static ClusterIP for web pods to resolve authHost (external IdP or legacy).
  # When keycloak.enabled, the web Deployment init container sets this automatically.
  authHostAliasIp: ""
  allowedRoutes:
    from: Same
  tls:
    enabled: false
    secretName: repody-tls
    redirectHttp: true

# ── Platform secrets & config ─────────────────────────────────────────────────
secrets:
  authSecret: ""
  keycloakClientSecret: ""
  llamacppApiKey: ""
  create: false
  existingSecret: repody-runtime-secrets

config:
  oidcEnabled: true
  authUrl: ""
  # Public issuer in browser JWTs (route / ingress hostname).
  oidcIssuer: https://auth.example.com/realms/repody
  # Optional extra accepted JWT iss values (comma-separated list in values).
  oidcIssuerAliases: []
  # In-cluster JWKS fetch URL. When empty and keycloak.enabled, Helm derives
  # http://<release>-keycloak:8080/realms/.../certs (same pattern as Compose
  # AUDIT_OIDC_JWKS_URL=http://keycloak:8080/...).
  oidcJwksUrl: ""
  # Web Auth.js server-side token endpoint (in-cluster Keycloak DNS).
  # Browser still uses oidcIssuer / AUTH_KEYCLOAK_ISSUER for redirects.
  oidcInternalIssuer: ""
  keycloakAdminUrl: ""
  keycloakAdminUsername: admin
  keycloakAdminPassword: ""
  oidcAudience: repody-api
  keycloakClientId: repody-web
  inferenceMode: llamacpp
  # External OpenAI-compatible document-model endpoint. This chart does not run inference.
  # Never use host.docker.internal here — that is Compose-only.
  llamacppBaseUrl: https://vlm.example.com/v1
  # Must match llama-server --alias / /v1/models id (local: NuExtract3-Q4_K_M).
  llamacppServedModel: nuextract3-q4_k_m
  extractor: pipeline
  defaultDocumentModelId: repody:vlm
  repodyVlmEnabled: true
  repodyVlmTimeoutSeconds: 180
  # Hard cap: audit tasks must finish within 3 minutes (see docs/deploy/PROD-OBSERVABILITY.md)
  workerTaskTimeoutMinutes: 3
  staleRunTimeoutMinutes: 5
  # For long OCR PDFs raise together, e.g. workerTaskTimeoutMinutes: 10,
  # staleRunTimeoutMinutes: 12, and matching *TimeoutSeconds <= worker*60.
  queuedStaleTimeoutMinutes: 60
  # Platform agent recipe (ADR 007).
  agentIdpEnabled: true
  maintenanceIntervalSeconds: 60
  dbPoolSize: 20
  dbMaxOverflow: 20
  redisMaxConnections: 64
  corsOrigins: '["https://app.example.com"]'
  logJson: true
  directUploadEnabled: true
  rateLimitFailClosed: true
  rateLimitEnabled: true
  rateLimitWindowSeconds: 60
  rateLimitRunsPerWorkflow: 300
  rateLimitRunsPerClient: 2000
  rateLimitHttpPerMinute: 6000
  admissionMaxQueued: 200
  admissionMaxInflight: 100
  admissionMaxExtractInflight: 20
  admissionRetryAfterSeconds: 15
  dispatchReplayBatchSize: 100
  dispatchKiqConcurrency: 16
  queueRefreshSseLimit: 32
  queueRefreshDbLimit: 128
  outboxRetainDispatchedDays: 7
  operatorActionsEnabled: false
  repodyVlmMarkdownOnExtract: false
  # Local/dev catalog includes PP-OCRv6 by default; set base URL to a reachable OCR API in-cluster.
  # Never use host.docker.internal — that is Compose-only (Docker Desktop).
  paddleocrV6Enabled: false
  paddleocrV6BaseUrl: http://paddleocr-v6:8868
  paddleocrV6TimeoutSeconds: 180
  paddleocrV6UseDocOrientationClassify: true
  paddleocrV6UseDocUnwarping: true
  paddleocrV6UseTextlineOrientation: true
  # paddleocr:qwen (PP-OCR + Qwen text→JSON). Off until cluster URLs are set.
  paddleocrQwenEnabled: false
  qwen35BaseUrl: http://qwen35:8084/v1
  qwen35ServedModel: Qwen3.5-4B
  qwen35TimeoutSeconds: 180
  # GLM-OCR — local Compose uses host llama-server; cluster may point at a dedicated service.
  glmOcrEnabled: false
  glmOcrBaseUrl: http://glmocr:8083/v1
  glmOcrServedModel: glm-ocr:latest
  glmOcrTimeoutSeconds: 180
  # Official SDK layout (PP-DocLayoutV3) — requires backend image built with
  # REPODY_BACKEND_EXTRAS=otel,glmocr (default for pnpm images:build).
  glmOcrLayoutDevice: cpu
  glmOcrLayoutModelDir: PaddlePaddle/PP-DocLayoutV3_safetensors
  glmOcrSdkMaxWorkers: 1
  glmOcrIdCardProfile: false
  gpuLiveProbe: false
  healthzProbeInference: false

observability:
  bugsinkDsn: ""
  existingSecret: ""
  bugsinkDsnKey: BUGSINK_DSN
  # OTLP HTTP traces (/v1/traces). Logs stay JSON on stdout; trace_id is correlated in structlog.
  otelEnabled: false
  otelEndpoint: ""

# Off by default — cluster / platform team owns NetworkPolicy and egress.
# Opt in only when the chart must emit policies (generic K8s without platform NP).
# OpenShift installs rely on this default staying disabled.
networkPolicy:
  enabled: false
  dnsNamespaces:
    - openshift-dns
    - kube-system
  # When networkPolicy.enabled=true, set cluster-specific CIDRs (never 0.0.0.0/0).
  externalEgress:
    enabled: false
    cidrs: []
    ports:
      - 80
      - 443
      - 5432
      - 6379
      - 6380
      - 7070
      - 8081
      - 8083
      - 8084
      - 8868
      - 9000
