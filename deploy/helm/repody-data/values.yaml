global:
  imagePullSecrets: []
  deploymentEnvironment: production

# Official Docker Library + pgsty MinIO fork (same pins as compose.yaml).
postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: postgres
    tag: "17.11-alpine"
  auth:
    username: audit
    database: repody
    existingSecret: ""
    secretKeys:
      passwordKey: password
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources: {}

redis:
  enabled: false
  image:
    registry: docker.io
    repository: redis
    tag: "8.8.3-alpine"
  auth:
    # Require auth + existingSecret whenever redis.enabled=true (bundled overlay sets both).
    enabled: true
    existingSecret: ""
    passwordKey: redis-password
  persistence:
    enabled: true
    size: 4Gi
    storageClass: ""
  resources: {}

minio:
  enabled: false
  image:
    registry: docker.io
    repository: pgsty/minio
    tag: RELEASE.2026-08-04T00-00-00Z
  mcImage:
    registry: docker.io
    repository: pgsty/mc
    tag: RELEASE.2026-09-16T00-00-00Z
  auth:
    existingSecret: ""
    rootUserKey: rootUser
    rootPasswordKey: rootPassword
  defaultBuckets: audit-documents
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources: {}

gatewayConsumerNamespace: repody

# ReferenceGrant needs gateway.networking.k8s.io CRDs. Keep false for Ingress-only.
gatewayApi:
  referenceGrantsEnabled: false
