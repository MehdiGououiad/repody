# Repody Mac runtime - Hub images only (no application source).
# Vendor packs this folder; clients never need the monorepo.
#
#   ./bin/repody setup && ./bin/repody start
#
# Requires: Docker Desktop, host llama-server + NuExtract GGUFs (see README).

name: repody

x-backend: &backend
  image: ${REPODY_BACKEND_IMAGE:-mehdigououiad/repody-backend:0.1.0}
  pull_policy: ${REPODY_PULL_POLICY:-missing}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  postgres:
    image: ${REPODY_POSTGRES_IMAGE:-postgres:17.11-alpine}
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${REPODY_POSTGRES_PASSWORD:-audit-local-dev}
      POSTGRES_DB: repody
    ports:
      - "5432:5432"
    volumes:
      - repody-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d repody"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REPODY_REDIS_IMAGE:-redis:8.8.3-alpine}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${REPODY_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${REPODY_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${REPODY_MINIO_PASSWORD:-minio-local-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - repody-minio:/data
    restart: unless-stopped

  minio-init:
    image: ${REPODY_MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minio-local-dev &&
      mc mb --ignore-existing local/audit-documents
      "

  keycloak:
    image: ${REPODY_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.4}
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${REPODY_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${REPODY_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./config/realm-repody.json:/opt/keycloak/data/import/realm-repody.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "repody.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit:${REPODY_POSTGRES_PASSWORD:-audit-local-dev}@postgres:5432/repody
      AUDIT_REDIS_URL: redis://redis:6379/0
      AUDIT_MINIO_ENDPOINT: minio:9000
      AUDIT_MINIO_PUBLIC_ENDPOINT: localhost:9000
      AUDIT_MINIO_BUCKET: audit-documents
      AUDIT_MINIO_ACCESS_KEY: ${REPODY_MINIO_USER:-minioadmin}
      AUDIT_MINIO_SECRET_KEY: ${REPODY_MINIO_PASSWORD:-minio-local-dev}
      AUDIT_MINIO_SECURE: "false"
      AUDIT_OIDC_ENABLED: "true"
      AUDIT_OIDC_ISSUER: http://localhost:8080/realms/repody
      AUDIT_OIDC_ISSUER_ALIASES: http://127.0.0.1:8080/realms/repody
      AUDIT_OIDC_JWKS_URL: http://keycloak:8080/realms/repody/protocol/openid-connect/certs
      AUDIT_OIDC_AUDIENCE: repody-api
      AUDIT_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      AUDIT_KEYCLOAK_ADMIN_USER: ${REPODY_KEYCLOAK_ADMIN_USER:-admin}
      AUDIT_KEYCLOAK_ADMIN_PASSWORD: ${REPODY_KEYCLOAK_ADMIN_PASSWORD:-admin}
      AUDIT_KEYCLOAK_CLIENT_ID: repody-web
      AUDIT_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-repody-web-dev-secret}
      AUDIT_RUN_MIGRATIONS_ON_STARTUP: "true"
      AUDIT_SEED_ON_STARTUP: ${AUDIT_SEED_ON_STARTUP:-true}
      AUDIT_DEPLOYMENT_ENVIRONMENT: development
      AUDIT_LOG_JSON: "true"
      AUDIT_LOG_FILE: /tmp/repody/api.log
      AUDIT_OTEL_ENABLED: "false"
      AUDIT_LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
      AUDIT_LLAMACPP_SERVED_MODEL: ${AUDIT_LLAMACPP_SERVED_MODEL:-nuextract3-q4_k_m}
      AUDIT_EXTRACTION_CACHE_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  web:
    image: ${REPODY_WEB_IMAGE:-mehdigououiad/repody-web:0.1.0}
    pull_policy: ${REPODY_PULL_POLICY:-missing}
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-32chars-min!}
      AUTH_URL: http://localhost:3000
      AUTH_KEYCLOAK_ID: repody-web
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-repody-web-dev-secret}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-repody-web-dev-secret}
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/repody
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/repody
      BACKEND_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000
    restart: unless-stopped

  worker-extract:
    <<: *backend
    command: ["python", "-m", "repody.taskiq.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit:${REPODY_POSTGRES_PASSWORD:-audit-local-dev}@postgres:5432/repody
      AUDIT_REDIS_URL: redis://redis:6379/0
      AUDIT_MINIO_ENDPOINT: minio:9000
      AUDIT_MINIO_BUCKET: audit-documents
      AUDIT_MINIO_ACCESS_KEY: ${REPODY_MINIO_USER:-minioadmin}
      AUDIT_MINIO_SECRET_KEY: ${REPODY_MINIO_PASSWORD:-minio-local-dev}
      AUDIT_MINIO_SECURE: "false"
      AUDIT_OIDC_ENABLED: "false"
      AUDIT_LOG_JSON: "true"
      AUDIT_DEPLOYMENT_ENVIRONMENT: development
      AUDIT_LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
      AUDIT_LLAMACPP_SERVED_MODEL: ${AUDIT_LLAMACPP_SERVED_MODEL:-nuextract3-q4_k_m}
      AUDIT_REPODY_VLM_WARMUP_ON_START: "false"
      AUDIT_EXTRACTION_CACHE_ENABLED: "false"
      AUDIT_WORKER_TASK_TIMEOUT_MINUTES: "10"
      AUDIT_STALE_RUN_TIMEOUT_MINUTES: "12"
      AUDIT_QUEUED_STALE_TIMEOUT_MINUTES: "60"
      AUDIT_WORKER_POOL: extract
      AUDIT_WORKER_EXTRACT_MAX_JOBS: "1"
    healthcheck:
      test: ["CMD", "python", "-m", "repody.taskiq.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-fast:
    <<: *backend
    command: ["python", "-m", "repody.taskiq.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit:${REPODY_POSTGRES_PASSWORD:-audit-local-dev}@postgres:5432/repody
      AUDIT_REDIS_URL: redis://redis:6379/0
      AUDIT_MINIO_ENDPOINT: minio:9000
      AUDIT_MINIO_BUCKET: audit-documents
      AUDIT_MINIO_ACCESS_KEY: ${REPODY_MINIO_USER:-minioadmin}
      AUDIT_MINIO_SECRET_KEY: ${REPODY_MINIO_PASSWORD:-minio-local-dev}
      AUDIT_MINIO_SECURE: "false"
      AUDIT_OIDC_ENABLED: "false"
      AUDIT_LOG_JSON: "true"
      AUDIT_DEPLOYMENT_ENVIRONMENT: development
      AUDIT_WORKER_POOL: fast

volumes:
  repody-postgres:
  repody-minio:
