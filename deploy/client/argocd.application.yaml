# Argo CD Application (namespace argocd): chart from the vendor release tag, values from the
# client's private GitOps repo. Prerequisites: repody-runtime-secrets and the registry pull
# secret exist (External Secrets), and CHANGE_ME_* below are replaced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repody
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: CHANGE_ME_VENDOR_REPO_URL
      targetRevision: CHANGE_ME_VENDOR_TAG
      path: deploy/helm/repody
      helm:
        releaseName: repody
        valueFiles:
          - $values/values.yaml # from values-production.yaml.example
          # - $values/helm-images.yaml # optional digest pins from the release
    - repoURL: CHANGE_ME_CLIENT_GITOPS_REPO_URL
      targetRevision: CHANGE_ME_CLIENT_GITOPS_BRANCH
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: repody
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
