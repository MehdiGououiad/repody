# Example: public Docker Hub repositories (linux/amd64 + linux/arm64).
# Replace mehdigououiad if you publish under a different Hub namespace.
#
# Production: use an immutable tag from the vendor release — never latest.
# Platform only: API / web / workers. Inference stays external
# (docs/REPODY-VLM.md, docs/PADDLEOCR-V6.md).

images:
  backend:
    repository: mehdigououiad/repody-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  api:
    repository: mehdigououiad/repody-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  worker:
    repository: mehdigououiad/repody-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  web:
    repository: mehdigououiad/repody-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  workerExtract:
    repository: mehdigououiad/repody-backend
    tag: "0.1.0"
  workerFast:
    repository: mehdigououiad/repody-backend
    tag: "0.1.0"

# Public Hub images need no pull secret. Private Hub:
# global:
#   imagePullSecrets:
#     - name: dockerhub-pull-secret
