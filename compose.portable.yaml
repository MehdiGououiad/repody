# Portable overlay - prebuilt images, no build at start.
#
#   pnpm platform          # builds repody-backend:dev + repody-web:dev from this checkout first
#   docker compose -f compose.yaml -f compose.portable.yaml --profile workers up -d --no-build
#
# This file adds the API and the UI; the worker is in compose.yaml (the same backend image).
#
# Images: REPODY_BACKEND_IMAGE / REPODY_WEB_IMAGE, default repody-*:dev (pnpm images:build);
# set them to a registry tag to run a published release.
# Inference stays on the host (llama-server for NuExtract).
# See docs/LOCAL.md

name: repody

x-portable-backend: &portable-backend
  image: ${REPODY_BACKEND_IMAGE:-repody-backend:dev}
  pull_policy: ${REPODY_PULL_POLICY:-missing}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-backend-env: &backend-env
  AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit-local-dev@postgres:5432/repody
  # Hatchet (compose.yaml): the token from backend/.env, the engine over the stack network.
  HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
  HATCHET_CLIENT_HOST_PORT: hatchet-lite:7077
  HATCHET_CLIENT_SERVER_URL: http://hatchet-lite:8888
  HATCHET_CLIENT_TLS_STRATEGY: none
  AUDIT_S3_ENDPOINT_URL: http://seaweedfs:8333
  AUDIT_S3_ACCESS_KEY: repody
  AUDIT_S3_SECRET_KEY: s3-local-dev
  AUDIT_DEPLOYMENT_ENVIRONMENT: development
  AUDIT_LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
  AUDIT_LLAMACPP_SERVED_MODEL: ${AUDIT_LLAMACPP_SERVED_MODEL:-nuextract3-q8_0}
  AUDIT_INFERENCE_TIMEOUT_SECONDS: ${AUDIT_INFERENCE_TIMEOUT_SECONDS:-600}
  AUDIT_RUN_TIMEOUT_MINUTES: ${AUDIT_RUN_TIMEOUT_MINUTES:-10}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  SENTRY_DSN: ${BUGSINK_DSN:-}

services:
  api:
    <<: *portable-backend
    command: ["uvicorn", "repody.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-lite:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      # Browser tokens carry the localhost issuer; the API fetches the JWKS over Docker DNS.
      AUDIT_OIDC_ENABLED: "true"
      AUDIT_OIDC_ISSUER: http://localhost:8080/realms/repody
      AUDIT_OIDC_ISSUER_ALIASES: http://127.0.0.1:8080/realms/repody
      AUDIT_OIDC_JWKS_URL: http://keycloak:8080/realms/repody/protocol/openid-connect/certs
      AUDIT_OIDC_AUDIENCE: repody-api
      AUDIT_RUN_MIGRATIONS_ON_STARTUP: "true"
      AUDIT_SEED_ON_STARTUP: ${AUDIT_SEED_ON_STARTUP:-true}
      OTEL_SERVICE_NAME: repody-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  web:
    image: ${REPODY_WEB_IMAGE:-repody-web:dev}
    pull_policy: ${REPODY_PULL_POLICY:-missing}
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-32chars-min!}
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_KEYCLOAK_ID: repody-web
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-repody-web-dev-secret}
      # Browser redirects use the public issuer; Better Auth server calls use Docker DNS.
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/repody
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/repody
      BACKEND_URL: http://api:8000
      BUGSINK_DSN: ${BUGSINK_DSN:-}
    # Better Auth answers /api/auth/ok once Next.js serves requests (compose up --wait waits on it).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
