# Portable overlay - pull Hub images (no local Docker build). Windows + macOS + Linux.
#
#   pnpm platform
#   docker compose -f compose.yaml -f compose.portable.yaml --profile workers up -d --no-build
#
# Images: mehdigououiad/repody-backend + repody-web (linux/amd64 + linux/arm64).
# Inference stays on the host (llama-server for NuExtract).
# See docs/LOCAL.md

name: repody

x-portable-backend: &portable-backend
  image: ${REPODY_BACKEND_IMAGE:-mehdigououiad/repody-backend:0.1.0}
  pull_policy: ${REPODY_PULL_POLICY:-missing}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-backend-env: &backend-env
  AUDIT_DATABASE_URL: postgresql+asyncpg://audit:audit-local-dev@postgres:5432/repody
  AUDIT_REDIS_URL: redis://redis:6379/0
  AUDIT_S3_ENDPOINT_URL: http://minio:9000
  AUDIT_S3_ACCESS_KEY: minioadmin
  AUDIT_S3_SECRET_KEY: minio-local-dev
  AUDIT_DEPLOYMENT_ENVIRONMENT: development
  AUDIT_LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
  AUDIT_LLAMACPP_SERVED_MODEL: ${AUDIT_LLAMACPP_SERVED_MODEL:-nuextract3-q8_0}
  AUDIT_MARKDOWN_PROVIDER: ${AUDIT_MARKDOWN_PROVIDER:-nuextract}
  AUDIT_LIGHTONOCR_BASE_URL: http://host.docker.internal:8082/v1
  AUDIT_LIGHTONOCR_SERVED_MODEL: ${AUDIT_LIGHTONOCR_SERVED_MODEL:-lightonocr-3-4b}
  AUDIT_INFERENCE_TIMEOUT_SECONDS: ${AUDIT_INFERENCE_TIMEOUT_SECONDS:-600}
  AUDIT_RUN_TIMEOUT_MINUTES: ${AUDIT_RUN_TIMEOUT_MINUTES:-10}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  SENTRY_DSN: ${BUGSINK_DSN:-}

services:
  api:
    <<: *portable-backend
    command: ["uvicorn", "repody.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # One-shot bucket init; this condition also lets `compose up --wait` accept its exit 0.
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      # Browser tokens carry the localhost issuer; the API fetches the JWKS over Docker DNS.
      AUDIT_OIDC_ENABLED: "true"
      AUDIT_OIDC_ISSUER: http://localhost:8080/realms/repody
      AUDIT_OIDC_ISSUER_ALIASES: http://127.0.0.1:8080/realms/repody
      AUDIT_OIDC_JWKS_URL: http://keycloak:8080/realms/repody/protocol/openid-connect/certs
      AUDIT_OIDC_AUDIENCE: repody-api
      AUDIT_RUN_MIGRATIONS_ON_STARTUP: "true"
      AUDIT_SEED_ON_STARTUP: ${AUDIT_SEED_ON_STARTUP:-true}
      OTEL_SERVICE_NAME: repody-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  web:
    image: ${REPODY_WEB_IMAGE:-mehdigououiad/repody-web:0.1.0}
    pull_policy: ${REPODY_PULL_POLICY:-missing}
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-32chars-min!}
      AUTH_URL: http://localhost:3000
      AUTH_KEYCLOAK_ID: repody-web
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-repody-web-dev-secret}
      # Browser redirects use the public issuer; Auth.js server calls use Docker DNS.
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/repody
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/repody
      BACKEND_URL: http://api:8000
      BUGSINK_DSN: ${BUGSINK_DSN:-}
    restart: unless-stopped

  worker:
    <<: *portable-backend
    profiles: [workers]
    command: ["taskiq", "worker", "repody.worker:broker", "--workers", "1", "--max-async-tasks", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: repody-worker
